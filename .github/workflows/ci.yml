name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same images/credentials as deploy/docker-compose.yml's mysql/redis
    # services — GitHub Actions publishes service containers on
    # 127.0.0.1:<mapped port>, which matches internal/pkg/config's own
    # MYSQL_DSN/REDIS_ADDR defaults exactly, but they're set explicitly
    # below rather than relied on implicitly.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aigc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/aigc?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: "127.0.0.1:6379"
      # Matches internal/pkg/config's own MinIO defaults exactly (same
      # reasoning as the mysql/redis env above) — set explicitly rather
      # than relied on implicitly.
      MINIO_ENDPOINT: "127.0.0.1:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: "aigc-assets"
      MINIO_PUBLIC_BASE_URL: "http://127.0.0.1:9000/aigc-assets"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # MinIO isn't started via jobs.<id>.services — that block has no way
      # to override a service image's CMD, and minio/minio's default
      # ENTRYPOINT needs "server /data" args to actually boot as a server
      # (see deploy/Dockerfile.minio's own doc on this same limitation).
      # ubuntu-latest ships Docker Engine already, so a plain `docker run`
      # step has full control over that where the services: block doesn't.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1
      - run: go build ./...
      - run: go vet ./...
      # internal/interfaces/http's tests need real MySQL/Redis/MinIO to run
      # for real rather than skip (server_test.go's own newTestServer doc,
      # assets_upload_roundtrip_test.go's own newFullTestServerWithObjects
      # doc) — this is the one step that actually exercises them,
      # everywhere else in this workflow is schema-agnostic.
      - name: Apply migrations
        run: go run ./cmd/migrate
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc -b (typecheck) then vite build — package.json's own "build" script.
      - run: npm run build
