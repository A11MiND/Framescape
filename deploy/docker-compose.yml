name: aigc-platform

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aigc
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/aigc?parseTime=true&loc=UTC&charset=utf8mb4"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: scheduler
    env_file: ../.env
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/aigc?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      # Public asset URLs are served to the browser on the host, not another
      # container — must stay a host-reachable address, unlike the other
      # docker-network-internal endpoints above.
      MINIO_PUBLIC_BASE_URL: "http://localhost:9000/aigc-assets"
      SCHEDULER_ADDR: ":8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    env_file: ../.env
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/aigc?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_BASE_URL: "http://localhost:9000/aigc-assets"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file: ../.env
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/aigc?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      SCHEDULER_URL: "http://scheduler:8090"
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      scheduler:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - scheduler

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mysql_data:
  minio_data:
  prometheus_data:
  grafana_data:
