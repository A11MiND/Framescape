# Scrapes every api and worker replica: Docker's DNS returns one address per
# replica for the service name.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "aigc-api"
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8080

  - job_name: "aigc-worker"
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8091
