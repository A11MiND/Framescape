# Isolated disposable integration-test services. Never mount production volumes.
name: aigc-comic-tests
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test-only
      MYSQL_DATABASE: aigc
    ports: ["127.0.0.1:13316:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest-only"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7
    ports: ["127.0.0.1:16386:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:19000:9000"]
