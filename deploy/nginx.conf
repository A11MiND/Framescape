server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving api/minio via a variable (below)
    # instead of a bare proxy_pass target defers lookup to request time —
    # a bare hostname resolves once at nginx startup and never again, so a
    # restarted api/minio container (restart: unless-stopped) with a new
    # internal IP would 502 forever until nginx itself was restarted.
    resolver 127.0.0.11 valid=10s;

    # Job-progress SSE stream lives under here — buffering would hold every
    # event back until nginx's buffer fills or the response ends.
    location /api/ {
        set $upstream_api api:8080;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # MINIO_PUBLIC_BASE_URL already includes the aigc-assets bucket name, so
    # this matches MinIO's own object path shape (/{bucket}/{key}) as-is.
    #
    # client_max_body_size: nginx's own default is 1m, which silently 413s
    # any presigned-PUT upload over 1MB — nearly every phone photo and every
    # video. 1024m covers this project's largest allowed upload with
    # headroom (F2.1 has no server-side size cap of its own yet; this is the
    # only hard ceiling until one's added).
    location /aigc-assets/ {
        client_max_body_size 1024m;
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
